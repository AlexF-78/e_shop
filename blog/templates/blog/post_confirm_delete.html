{% extends 'blog/base.html' %}

{% block title %}Удаление {{ object.title }} - Блог{% endblock %}

{% block content %}
<h1>Удаление записи</h1>

<div class="alert alert-warning">
    <p>Вы уверены, что хотите удалить запись "{{ object.title }}"?</p>
    <p>Это действие нельзя отменить.</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
