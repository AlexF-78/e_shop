{% extends 'base.html' %}

{% block title %}Вход - Skystore{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center mb-4">Вход в систему</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        <p class="text-center mt-3">
            Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрируйтесь</a>
        </p>
    </div>
</div>
{% endblock %}
